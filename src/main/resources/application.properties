spring.application.name=coupon-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coupons}
spring.datasource.username=${DB_USER:coupons}
spring.datasource.password=${DB_PASSWORD:coupons}

# --- security ---
# No default secret: the service must fail fast when JWT_SECRET is missing (>=32 bytes required).
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=coupon-service
app.security.jwt.ttl=1h
# Demo users (bcrypt). Override via env in real deployments.
app.security.users[0].username=admin
app.security.users[0].password={bcrypt}$2y$10$9F5UpUPzWy5wTsVYw9aEWe2jUItVIzg20GKDLeaicNbVhPKLfY7Rm
app.security.users[0].roles[0]=ADMIN
app.security.users[1].username=user
app.security.users[1].password={bcrypt}$2y$10$O23GtkfUSZt4g56bHuizFu5OKxqModarbPNQ5K9UxWNw.uVBIm4PW
app.security.users[1].roles[0]=USER

# --- client IP trust (spec §10; prior-review finding #1) ---
# Comma-separated CIDRs. Empty (default) = X-Forwarded-For is ignored entirely.
app.http.trusted-proxies=${TRUSTED_PROXIES:}

# --- geoip (spec §10) ---
# IPinfo Lite: free unlimited country-level lookups over HTTPS; token from https://ipinfo.io (free signup).
app.geoip.base-url=${GEOIP_BASE_URL:https://api.ipinfo.io}
app.geoip.token=${GEOIP_TOKEN:}
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=2s
app.geoip.cache-ttl=1h
app.geoip.cache-max-size=10000
# Empty = private/loopback client IPs are rejected (403 COUNTRY_UNRESOLVABLE).
# The compose demo sets PL so local redemption works end to end.
app.geoip.private-ip-fallback-country=${GEOIP_PRIVATE_IP_FALLBACK_COUNTRY:}
app.geoip.circuit-breaker-failure-rate-threshold=50
app.geoip.circuit-breaker-sliding-window-size=10
app.geoip.circuit-breaker-minimum-number-of-calls=5
app.geoip.circuit-breaker-wait-duration-in-open-state=30s
